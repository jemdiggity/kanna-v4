[package]
name = "kanna-syntax"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Kanna.app's code highlighting: tree-sitter grammars and queries behind a small C interface that takes a language and text and returns highlight spans and scopes."

[dependencies]
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-bash = "0.25.1"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"
