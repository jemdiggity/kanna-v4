[package]
name = "kanna-layout"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-MIT"
description = "Kanna.app's layout: kanna-mux's layout model, kept and saved by the app, behind a small C interface that takes and returns JSON."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
kanna-mux = { path = "../kanna-mux" }
serde_json = "1"
