<!doctype html>
<!--
  kmux reference mockup.
  A single-file, dependency-free model of kmux's design and behaviour:
  windows, tabs, panes (term / web / ios), fractional splits, the pane
  lifecycle, and the control protocol. The console speaks kanna commands,
  which are turned into protocol requests and handled by the same core the
  UI uses. Everything inside panes is simulated.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kmux mockup</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212a; --border: #2a2f3a;
    --text: #d7dae0; --dim: #8b93a1; --accent: #7aa2f7; --green: #9ece6a;
    --red: #f7768e; --yellow: #e0af68; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input { font: inherit; color: inherit; background: transparent; border: 0; outline: none; }

  #app { display: flex; flex-direction: column; height: 100%; }
  .menubar { display: flex; align-items: center; gap: 2px; height: 26px; padding: 0 10px; background: #1b1e25; border-bottom: 1px solid var(--border); }
  .menubar b { margin-right: 8px; }
  .menubar button { border: 0; background: transparent; padding: 1px 8px; }
  .menubar button:hover { background: var(--panel-2); }
  .menubar .spacer { flex: 1; }
  .menubar .note { color: var(--dim); font-size: 12px; }

  #desktop { position: relative; flex: 1; min-height: 0; overflow: hidden; background: radial-gradient(circle at 30% 20%, #262c3c, #0c0e12 70%); }
  .desktop-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--dim); }
  .desktop-empty div { display: flex; gap: 6px; }

  .win { position: absolute; display: flex; flex-direction: column; background: var(--panel); border: 1px solid #3a404c; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .win.key { box-shadow: 0 18px 50px rgba(0,0,0,.6); border-color: #4a5160; }
  .win-titlebar { flex: none; display: flex; align-items: center; height: 28px; padding: 0 10px; user-select: none; }
  .win:not(.key) .win-titlebar { color: var(--dim); }
  .lights { display: flex; gap: 7px; }
  .light { width: 12px; height: 12px; padding: 0; border: 0; border-radius: 50%; background: #4a4f5a; }
  .win.key .light.close { background: #ff5f57; } .win.key .light.min { background: #febc2e; } .win.key .light.max { background: #28c840; }
  .win-title { flex: 1; padding-right: 50px; overflow: hidden; text-align: center; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .win-resize { position: absolute; right: 0; bottom: 0; z-index: 6; width: 14px; height: 14px; cursor: nwse-resize; }

  .win-tabs { flex: none; display: flex; align-items: stretch; gap: 2px; height: 28px; padding: 0 6px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 0; background: transparent; color: var(--dim); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .win:not(.key) .tab.active { border-bottom-color: var(--dim); }
  .tab .x { opacity: .5; } .tab .x:hover { opacity: 1; color: var(--red); }
  .tab-add { border: 0; background: transparent; color: var(--dim); }
  .tab.dragging { opacity: .5; }
  .tab.drop-before { box-shadow: inset 2px 0 0 var(--accent); }
  .tab.drop-after { box-shadow: inset -2px 0 0 var(--accent); }
  .tab.drop-target, .tab-add.drop-target { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); }
  .pane.dragging { opacity: .5; }
  .drop-hint { position: fixed; z-index: 15; display: flex; align-items: center; justify-content: center; background: rgba(122,162,247,.22); border: 2px solid var(--accent); color: var(--accent); font: 600 12px var(--mono); pointer-events: none; }
  .drop-hint.new-win { border-style: dashed; border-radius: 10px; }
  .drop-hint[hidden], .drag-tip[hidden] { display: none; }

  .stage { flex: 1; display: flex; min-height: 0; min-width: 0; }
  .stage > * { flex: 1; }
  .split { display: flex; min-width: 0; min-height: 0; }
  .split.row { flex-direction: row; }
  .split.column { flex-direction: column; }
  .split.row > .divider { width: 4px; cursor: col-resize; }
  .split.column > .divider { height: 4px; cursor: row-resize; }
  .divider { flex: 0 0 auto; background: var(--border); touch-action: none; }
  .divider:hover, .divider.dragging { background: var(--accent); }
  .drag-tip { position: fixed; z-index: 20; padding: 2px 6px; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 4px; font: 11px var(--mono); color: var(--accent); pointer-events: none; }

  .pane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); overflow: hidden; }
  .win.key .stage.multi .pane.focused::after { content: ''; position: absolute; inset: 0; border: 1px solid var(--accent); pointer-events: none; z-index: 3; }
  .pane-close { position: absolute; top: 6px; right: 6px; z-index: 4; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; opacity: 0; transition: opacity .12s; }
  .pane:hover .pane-close { opacity: .8; }
  .pane-close:hover { opacity: 1 !important; background: var(--red); }
  .url-edit { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 5; width: min(85%, 420px); display: flex; padding: 4px 10px; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .url-edit input { flex: 1; min-width: 0; font-size: 12px; }
  .pane-body { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }

  .term { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #0b0d10; font-family: var(--mono); font-size: 12px; }
  .term-body { flex: 1; overflow: auto; padding: 6px 8px 0; white-space: pre-wrap; word-break: break-all; }
  .term-line.cmd { color: var(--text); } .term-line { color: #b7bcc6; }
  .term-line.err { color: var(--red); } .term-line.ok { color: var(--green); }
  .term-input { display: flex; padding: 0 8px 6px; }
  .term-input span { color: var(--accent); white-space: pre; }
  .term-input input { flex: 1; font-family: var(--mono); font-size: 12px; }
  .banner { margin: 6px 8px; padding: 4px 8px; border: 1px dashed var(--border); color: var(--dim); font-family: var(--mono); font-size: 11px; }

  .web { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .web-view { flex: 1; overflow: auto; background: #f6f7f9; color: #1d2330; }
  .web-wait { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #6b7280; text-align: center; padding: 12px; }
  .site-nav { display: flex; justify-content: space-between; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
  .site-hero { padding: 28px 16px; }
  .site-hero h1 { margin: 0 0 6px; font-size: 22px; }
  .site-hero p { margin: 0; color: #4b5563; }
  .site-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; padding: 0 16px 16px; }
  .site-cards div { height: 64px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; }

  .ios { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; min-height: 0; background: #12141a; container-type: size; }
  .phone { position: relative; flex: none; height: min(100cqh - 24px, (100cqw - 4px) * 19.5 / 9, 640px); aspect-ratio: 9 / 19.5; border: 6px solid #2b2f38; border-radius: 28px; background: #000; overflow: hidden; }
  .notch { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 34%; height: 14px; background: #2b2f38; border-radius: 10px; z-index: 2; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: #f2f2f7; color: #111; font-size: 11px; cursor: pointer; overflow: hidden; }
  .screen.boot { background: #000; color: #aaa; align-items: center; justify-content: center; gap: 8px; cursor: default; }
  .status { display: flex; justify-content: space-between; padding: 24px 14px 4px; font-weight: 600; font-size: 10px; }
  .app-title { padding: 8px 14px; font-size: 18px; font-weight: 700; }
  .app-row { margin: 0 10px 6px; padding: 10px; background: #fff; border-radius: 8px; }
  .app-btn { margin: auto 10px 14px; padding: 9px; text-align: center; background: #0a84ff; color: #fff; border-radius: 9px; font-weight: 600; }
  .ripple { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: rgba(10,132,255,.35); pointer-events: none; animation: ripple .5s ease-out forwards; }
  @keyframes ripple { to { transform: scale(2.4); opacity: 0; } }
  .device-label { color: var(--dim); font-size: 11px; }

  .fail { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; color: var(--red); }
  .fail pre { margin: 0; white-space: pre-wrap; color: var(--text); font-family: var(--mono); font-size: 12px; }
  .spinner { width: 18px; height: 18px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; opacity: .7; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .menu { position: fixed; z-index: 30; display: flex; flex-direction: column; min-width: 120px; padding: 4px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .menu button { display: flex; justify-content: space-between; gap: 24px; text-align: left; border: 0; background: transparent; white-space: nowrap; }
  .menu button:hover { background: var(--panel); }
  .menu .key { color: var(--dim); font-size: 12px; }
  .menu hr { width: 100%; margin: 4px 0; border: 0; border-top: 1px solid var(--border); }

  #console { display: flex; flex-direction: column; height: min(30vh, 260px); border-top: 3px dashed var(--yellow); background: #121419; }
  #console.collapsed { height: auto; }
  #console.collapsed #log, #console.collapsed #cmdform { display: none; }
  .console-head { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-bottom: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  .mock-tag { padding: 0 6px; border-radius: 3px; background: var(--yellow); color: #111; font-size: 10px; font-weight: 700; letter-spacing: .05em; }
  .console-head .spacer { flex: 1; }
  #log { flex: 1; overflow: auto; padding: 6px 10px; font-family: var(--mono); font-size: 12px; }
  #log div { white-space: pre-wrap; word-break: break-word; }
  .l-in { color: var(--text); } .l-req { color: var(--dim); } .l-res { color: var(--green); }
  .l-err { color: var(--red); } .l-info { color: var(--dim); } .l-exit { color: var(--dim); font-size: 11px; }
  #cmdform { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--border); font-family: var(--mono); }
  #cmdform span { color: var(--accent); }
  #cmd { flex: 1; font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <header class="menubar">
    <b>kmux</b>
    <button id="menu-pane">Pane</button><button id="menu-view">View</button><button id="menu-window">Window</button>
    <span class="spacer"></span>
    <span class="note">reference mockup · use ⌥ for ⌘N, ⌘T, ⌘W, ⇧⌘W and ⌘` (the browser keeps those)</span>
  </header>
  <main id="desktop"></main>
  <section id="console">
    <div class="console-head">
      <span class="mock-tag">MOCKUP ONLY</span>
      <span>Stands in for kanna and other clients — not part of kmux. Commands become control-protocol requests; UI actions are logged as the same requests.</span>
      <span class="spacer"></span>
      <button id="demo">Run demo</button><button id="reset">Reset</button><button id="toggle-console">Hide</button>
    </div>
    <div id="log"></div>
    <form id="cmdform" autocomplete="off"><span>$ kanna</span><input id="cmd" placeholder="open web http://localhost:3000 --split right --size 1/3   (type help)"></form>
  </section>
</div>

<script>
// ---------------------------------------------------------------------------
// State
// window := { id, tabs, active, focused, zoomed, x, y, w, h, z }
// tab    := { id, root, title?, lastFocus }
// node   := { t: 'pane', id } | { t: 'split', dir: 'row'|'column', kids: [{ node, size }] }
// Sizes are fractions of the parent split and always sum to 1.
// Empty containers close: a tab without panes, then a window without tabs.
// ---------------------------------------------------------------------------
const DEVICES = ['iPhone 16', 'iPhone 16 Pro', 'iPhone SE (3rd generation)', 'iPad Air (M2)'];
const MIN_PX = 80;
const NICE = [1/4, 1/3, 1/2, 2/3, 3/4];
let S;

function freshState() {
  return { panes: {}, windows: [], key: null, urlEdit: null, servers: {}, n: { pane: 0, tab: 0, win: 0, req: 0, z: 0 } };
}

const $ = s => document.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

class KErr extends Error { constructor(code, message) { super(message); this.code = code; } }
const kerr = (code, msg) => new KErr(code, msg);

// ---------------------------------------------------------------------------
// Fractions
// ---------------------------------------------------------------------------
function frac(v) {
  if (typeof v === 'number') return v;
  const s = String(v ?? '').trim();
  let m;
  if ((m = /^(\d*\.?\d+)\/(\d*\.?\d+)$/.exec(s))) return Number(m[1]) / Number(m[2]);
  if ((m = /^(\d*\.?\d+)%$/.exec(s))) return Number(m[1]) / 100;
  if (/^\d*\.?\d+$/.test(s)) return Number(s);
  throw kerr('bad_request', `"${s}" is not a fraction (try 1/3)`);
}
function fmtFrac(x) {
  if (Math.abs(x - 1) < 1e-6) return '1';
  for (let d = 2; d <= 8; d++) {
    const n = Math.round(x * d);
    if (n > 0 && Math.abs(x - n / d) < 0.004) return `${n}/${d}`;
  }
  return `${Math.round(x * 100)}%`;
}

// ---------------------------------------------------------------------------
// Windows and tabs
// ---------------------------------------------------------------------------
const winById = id => S.windows.find(w => w.id === id);
const keyWin = () => winById(S.key);
const allTabs = () => S.windows.flatMap(w => w.tabs);
const tabById = id => allTabs().find(t => t.id === id);
const winOfTab = t => S.windows.find(w => w.tabs.includes(t));
const activeTabOf = w => w && (w.tabs.find(t => t.id === w.active) || w.tabs[0]);
const desktopSize = () => { const d = $('#desktop'); return { W: d.clientWidth || 1000, H: d.clientHeight || 600 }; };

function makeWindow() {
  const { W, H } = desktopSize();
  const k = keyWin();
  let geo = k ? { x: k.x + 32, y: k.y + 32, w: k.w, h: k.h } : { x: 24, y: 18, w: W - 48, h: H - 36 };
  if (geo.x + geo.w > W || geo.y + geo.h > H) geo = { x: 24, y: 18, w: Math.min(geo.w, W - 48), h: Math.min(geo.h, H - 36) };
  const w = { id: 'w' + (++S.n.win), tabs: [], active: null, focused: null, zoomed: null, ...geo, z: ++S.n.z };
  S.windows.push(w);
  S.key = w.id;
  return w;
}
function makeTab(w, activate = true) {
  const t = { id: 't' + (++S.n.tab), root: null, lastFocus: null };
  w.tabs.push(t);
  if (activate || !w.active) w.active = t.id;
  return t;
}
function raise(w) { w.z = ++S.n.z; S.key = w.id; }
function targetWin(ref) {
  if (ref == null) return keyWin() || makeWindow();
  if (ref === 'new') return makeWindow();
  const w = winById(ref);
  if (!w) throw kerr('not_found', `no window "${ref}"`);
  return w;
}
function dropEmpty() {
  for (const w of S.windows) {
    const at = Math.max(0, w.tabs.findIndex(t => t.id === w.active));
    w.tabs = w.tabs.filter(t => t.root);
    if (!w.tabs.some(t => t.id === w.active)) w.active = w.tabs[Math.min(at, w.tabs.length - 1)]?.id ?? null;
    const ids = paneIds(activeTabOf(w)?.root);
    if (!ids.includes(w.focused)) w.focused = ids.includes(activeTabOf(w)?.lastFocus) ? activeTabOf(w).lastFocus : ids[0] ?? null;
    if (w.zoomed && !ids.includes(w.zoomed)) w.zoomed = null;
  }
  S.windows = S.windows.filter(w => w.tabs.length);
  if (!keyWin()) S.key = [...S.windows].sort((a, b) => b.z - a.z)[0]?.id ?? null;
}

// ---------------------------------------------------------------------------
// Layout trees
// ---------------------------------------------------------------------------
function locate(node, id, parent = null, index = -1) {
  if (!node) return null;
  if (node.t === 'pane') return node.id === id ? { node, parent, index } : null;
  for (let i = 0; i < node.kids.length; i++) {
    const r = locate(node.kids[i].node, id, node, i);
    if (r) return r;
  }
  return null;
}
function findPane(id) {
  for (const win of S.windows) for (const tab of win.tabs) {
    const loc = locate(tab.root, id);
    if (loc) return { win, tab, ...loc };
  }
  return null;
}
const paneIds = node => !node ? [] : node.t === 'pane' ? [node.id] : node.kids.flatMap(k => paneIds(k.node));
function normalize(node) {
  if (!node || node.t === 'pane') return node;
  node.kids.forEach(k => { k.node = normalize(k.node); });
  return node.kids.length === 1 ? node.kids[0].node : node;
}
function detach(id) {
  const f = findPane(id);
  if (!f) return;
  if (!f.parent) f.tab.root = null;
  else {
    const gone = f.parent.kids[f.index].size;
    f.parent.kids.splice(f.index, 1);
    const n = f.parent.kids.length;
    f.parent.kids.forEach(k => { k.size = gone < 1 ? k.size / (1 - gone) : 1 / n; });
    f.tab.root = normalize(f.tab.root);
  }
  if (f.win.zoomed === id) f.win.zoomed = null;
}
function toTree(node, size) {
  if (!node) return null;
  const out = node.t === 'pane'
    ? { pane: S.panes[node.id].name || node.id }
    : { split: node.dir, children: node.kids.map(k => toTree(k.node, k.size)) };
  if (size != null && size < 1 - 1e-6) out.size = fmtFrac(size);
  return out;
}
function tabTitle(t) {
  if (!t) return '';
  if (t.title) return t.title;
  const ids = paneIds(t.root);
  return ids.length ? ids.map(id => S.panes[id].name || id).join(' · ') : 'empty';
}
const resolvePane = ref => Object.values(S.panes).find(p => p.id === ref || p.name === ref);
function need(ref) {
  if (!ref) throw kerr('bad_request', 'missing pane');
  const p = resolvePane(ref);
  if (!p) throw kerr('not_found', `no pane "${ref}"`);
  return p;
}
function needTab(ref) {
  const t = tabById(ref);
  if (!t) throw kerr('not_found', `no tab "${ref}"`);
  return t;
}
const label = p => p.name ? `${p.name} (${p.id})` : p.id;

function place(paneId, w, { split = 'auto', size = 0.5, tab = false }) {
  const node = { t: 'pane', id: paneId };
  const t = tab || !w.tabs.length ? makeTab(w) : activeTabOf(w);
  w.zoomed = null;
  if (!t.root) { t.root = node; return; }
  const ids = paneIds(t.root);
  const target = ids.includes(w.focused) ? w.focused : ids[ids.length - 1];
  const dir = split === 'right' ? 'row' : split === 'down' ? 'column' : autoDir(target);
  insertBeside(t, target, node, dir, true, size);
}
function insertBeside(t, targetId, node, dir, after, size) {
  const loc = locate(t.root, targetId);
  if (loc.parent && loc.parent.dir === dir) {
    const share = loc.parent.kids[loc.index].size;
    loc.parent.kids[loc.index].size = share * (1 - size);
    loc.parent.kids.splice(loc.index + (after ? 1 : 0), 0, { node, size: share * size });
  } else {
    const kids = [{ node: loc.node, size: 1 - size }, { node, size }];
    if (!after) kids.reverse();
    const sp = { t: 'split', dir, kids };
    if (loc.parent) loc.parent.kids[loc.index].node = sp; else t.root = sp;
  }
}
function appendToTab(t, id) {
  const node = { t: 'pane', id };
  if (!t.root) t.root = node;
  else if (t.root.t === 'split' && t.root.dir === 'row') {
    const n = t.root.kids.length;
    t.root.kids.forEach(k => { k.size *= n / (n + 1); });
    t.root.kids.push({ node, size: 1 / (n + 1) });
  } else t.root = { t: 'split', dir: 'row', kids: [{ node: t.root, size: 1 / 2 }, { node, size: 1 / 2 }] };
}
function autoDir(id) {
  const el = document.querySelector(`.pane[data-id="${id}"]`);
  if (!el) return 'row';
  const r = el.getBoundingClientRect();
  return r.width >= r.height ? 'row' : 'column';
}

// ---------------------------------------------------------------------------
// Panes and lifecycle: starting -> running | failed; running -> exited; * -> closed
// ---------------------------------------------------------------------------
function createPane(type, a) {
  const p = {
    id: 'p' + (++S.n.pane), name: a.name || null, type, state: 'starting', error: null, gen: 0, waiters: [],
    cmd: a.cmd || null, cwd: a.cwd || '~', url: a.url ? normUrl(a.url) : null,
    app: a.app || null, device: a.device || 'iPhone 16', lines: [], draft: '', busy: false, server: null, exitCode: null,
  };
  S.panes[p.id] = p;
  return p;
}
function setState(p, state, extra = {}) {
  Object.assign(p, extra, { state });
  if (state !== 'starting') p.waiters.splice(0).forEach(fn => fn());
  render();
}
const settled = p => p.state !== 'starting' ? Promise.resolve() : new Promise(r => p.waiters.push(r));
function later(p, ms, fn) { const g = p.gen; setTimeout(() => { if (p.gen === g && S.panes[p.id] === p) fn(); }, ms); }

function start(p) {
  p.gen++;
  stopServer(p);
  p.error = null; p.exitCode = null;
  setState(p, 'starting');
  if (p.type === 'term') {
    p.lines = [];
    later(p, 150, () => { setState(p, 'running'); if (p.cmd) runTerm(p, p.cmd); });
  } else if (p.type === 'web') {
    later(p, 400, () => setState(p, 'running'));
  } else if (p.type === 'ios') {
    if (!DEVICES.includes(p.device)) {
      later(p, 600, () => setState(p, 'failed', { error: `Unknown device "${p.device}".\nAvailable: ${DEVICES.join(', ')}` }));
    } else {
      later(p, 1800, () => setState(p, 'running'));
    }
  }
}
function kill(p) {
  p.gen++;
  stopServer(p);
  p.waiters.splice(0).forEach(fn => fn());
  delete S.panes[p.id];
  p.state = 'closed';
}

// --- simulated terminal ----------------------------------------------------
const prompt = p => `${p.cwd} % `;
function termPrint(p, text, cls = '') { p.lines.push({ text, cls }); if (p.lines.length > 400) p.lines.shift(); }
function runTerm(p, line) {
  termPrint(p, prompt(p) + line, 'cmd');
  const [c, ...rest] = line.trim().split(/\s+/);
  const arg = rest.join(' ');
  if (!c) return render();
  if (c === 'clear') p.lines = [];
  else if (c === 'echo') termPrint(p, arg);
  else if (c === 'pwd') termPrint(p, p.cwd);
  else if (c === 'cd') p.cwd = arg || '~';
  else if (c === 'ls') termPrint(p, 'README.md  build  node_modules  package.json  src');
  else if (c === 'help') termPrint(p, 'simulated shell: echo, ls, pwd, cd, clear, npm run dev (ctrl+c stops), exit [code]');
  else if (c === 'exit') { setState(p, 'exited', { exitCode: Number(rest[0]) || 0 }); return; }
  else if (line.trim() === 'npm run dev' || line.trim() === 'npm start') startServer(p);
  else termPrint(p, `zsh: command not found: ${c}`, 'err');
  render();
}
function startServer(p) {
  p.busy = true;
  const host = 'localhost:3000';
  const steps = [[0, '> myapp@1.0.0 dev'], [0, '> vite --port 3000'], [500, ''], [400, '  VITE v6.0.0  ready in 312 ms', 'ok'], [0, ''], [0, '  ➜  Local:   http://localhost:3000/']];
  let t = 0;
  steps.forEach(([d, txt, cls], i) => {
    t += d;
    later(p, t, () => {
      if (!p.busy) return;
      termPrint(p, txt, cls);
      if (i === steps.length - 1) { S.servers[host] = p.id; p.server = host; }
      render();
    });
  });
}
function stopServer(p) {
  if (p.server) { delete S.servers[p.server]; p.server = null; }
  p.busy = false;
}
function interrupt(p) {
  if (!p.busy) { termPrint(p, prompt(p) + '^C'); render(); return; }
  termPrint(p, '^C');
  stopServer(p);
  render();
}

// --- web helpers -----------------------------------------------------------
function normUrl(u) { return /^[a-z]+:\/\//i.test(u) ? u : 'http://' + u; }
function hostOf(u) { try { return new URL(u).host; } catch { return u; } }
const isLocal = u => /^(localhost|127\.0\.0\.1)(:\d+)?$/.test(hostOf(u));

function summary(p) {
  const s = { id: p.id, name: p.name, type: p.type, state: p.state };
  if (p.type === 'term') Object.assign(s, { cmd: p.cmd, cwd: p.cwd });
  if (p.type === 'web') s.url = p.url;
  if (p.type === 'ios') Object.assign(s, { app: p.app, device: p.device });
  if (p.exitCode != null) s.exitCode = p.exitCode;
  if (p.error) s.error = p.error;
  return s;
}

// ---------------------------------------------------------------------------
// kmux core: handles control-protocol requests (see docs/kmux-spec.md §7)
// ---------------------------------------------------------------------------
function focusPane(p) {
  const f = findPane(p.id);
  f.win.active = f.tab.id;
  if (f.win.zoomed && f.win.zoomed !== p.id) f.win.zoomed = null;
  f.win.focused = p.id;
  raise(f.win);
}

async function handle(req) {
  const { id, cmd, args = {} } = req;
  const ok = x => ({ id, ok: true, ...x });
  try {
    switch (cmd) {
      case 'capabilities':
        return ok({ mux: 'kmux', paneTypes: ['term', 'web', 'ios'], features: ['windows', 'tabs', 'fractionalSizing', 'namedPanes', 'zoom', 'move', 'lifecycle'] });

      case 'open': {
        const { type } = args;
        if (!['term', 'web', 'ios'].includes(type)) throw kerr('bad_request', `unknown pane type "${type}" (term, web or ios)`);
        if (args.name && resolvePane(args.name)) throw kerr('name_taken', `a pane named "${args.name}" already exists`);
        if (args.split && !['right', 'down', 'auto'].includes(args.split)) throw kerr('bad_request', 'split must be right, down or auto');
        const size = args.size == null ? 0.5 : frac(args.size);
        if (!(size > 0 && size < 1)) throw kerr('bad_request', 'size must be a fraction between 0 and 1');
        if (type === 'web' && !args.url) throw kerr('bad_request', 'web panes need a url');
        if (type === 'ios' && !args.app) throw kerr('bad_request', 'ios panes need an app');
        const w = targetWin(args.window);
        const p = createPane(type, args);
        place(p.id, w, { split: args.split || 'auto', size, tab: !!args.tab });
        w.focused = p.id;
        raise(w);
        start(p);
        const res = () => ({ pane: summary(p), window: findPane(p.id)?.win.id ?? w.id });
        if (args.wait === false) return ok(res());
        await settled(p);
        if (p.state === 'failed') throw kerr('start_failed', p.error);
        return ok(res());
      }

      case 'arrange': {
        const used = [];
        const build = n => {
          if (n && n.pane != null) {
            const p = need(n.pane);
            if (used.includes(p.id)) throw kerr('layout_invalid', `"${n.pane}" appears more than once`);
            used.push(p.id);
            return { t: 'pane', id: p.id };
          }
          if (!n || !['row', 'column'].includes(n.split) || !Array.isArray(n.children) || !n.children.length)
            throw kerr('layout_invalid', 'malformed layout tree');
          const sizes = n.children.map(c => c.size == null ? null : frac(c.size));
          if (sizes.some(s => s != null && !(s > 0 && s <= 1))) throw kerr('layout_invalid', 'sizes must be fractions between 0 and 1');
          const given = sizes.reduce((a, s) => a + (s ?? 0), 0);
          const unsized = sizes.filter(s => s == null).length;
          if (given > 1 + 1e-9) throw kerr('layout_invalid', `sizes in a ${n.split} add up to ${fmtFrac(given)}, more than 1`);
          if (unsized && given >= 1 - 1e-9) throw kerr('layout_invalid', `no space left for the unsized panes in a ${n.split}`);
          const fill = unsized ? (1 - given) / unsized : 0;
          const scale = unsized ? 1 : 1 / given;
          return { t: 'split', dir: n.split, kids: n.children.map((c, i) => ({ node: build(c), size: (sizes[i] ?? fill) * scale })) };
        };
        const root = normalize(build(args.layout));
        const w = targetWin(args.window);
        const t = activeTabOf(w) || makeTab(w);
        used.forEach(detach);
        const leftovers = paneIds(t.root);
        t.root = root;
        if (leftovers.length) {
          const nt = makeTab(w, false);
          nt.title = 'unarranged';
          nt.root = normalize({ t: 'split', dir: 'row', kids: leftovers.map(id => ({ node: { t: 'pane', id }, size: 1 / leftovers.length })) });
        }
        w.zoomed = null;
        w.active = t.id;
        if (!used.includes(w.focused)) w.focused = used[0];
        raise(w);
        dropEmpty();
        render();
        return ok({ window: w.id, layout: toTree(t.root) });
      }

      case 'move': {
        const p = need(args.pane);
        const from = findPane(p.id);
        if (args.to) {
          const target = need(args.to);
          const side = args.side || 'swap';
          if (!['left', 'right', 'top', 'bottom', 'swap'].includes(side)) throw kerr('bad_request', 'side must be left, right, top, bottom or swap');
          if (target.id === p.id) return ok({ window: from.win.id });
          if (side === 'swap') {
            const b = findPane(target.id);
            from.node.id = target.id;
            b.node.id = p.id;
            if (from.win.focused === p.id) from.win.focused = target.id;
          } else {
            detach(p.id);
            insertBeside(findPane(target.id).tab, target.id, { t: 'pane', id: p.id },
              side === 'left' || side === 'right' ? 'row' : 'column', side === 'right' || side === 'bottom', 0.5);
          }
        } else {
          let dest;
          if (args.tab && args.tab !== 'new') dest = needTab(args.tab);
          else if (args.tab === 'new') dest = makeTab(args.window ? targetWin(args.window) : from.win);
          else if (args.window) { const w = targetWin(args.window); dest = w.tabs.length ? activeTabOf(w) : makeTab(w); }
          else throw kerr('bad_request', 'move needs to + side, tab, or window');
          if (dest === from.tab) return ok({ window: from.win.id });
          detach(p.id);
          appendToTab(dest, p.id);
        }
        focusPane(p);
        dropEmpty();
        render();
        const f = findPane(p.id);
        return ok({ window: f.win.id, tab: f.tab.id, layout: toTree(f.tab.root) });
      }

      case 'move-tab': {
        const t = needTab(args.tab);
        const src = winOfTab(t);
        const dest = targetWin(args.window ?? src.id);
        let index = args.index == null ? dest.tabs.length : Number(args.index);
        if (!Number.isInteger(index) || index < 0) throw kerr('bad_request', 'index must be a whole number ≥ 0');
        const fromIdx = src.tabs.indexOf(t);
        src.tabs.splice(fromIdx, 1);
        if (src === dest && index > fromIdx) index--;
        dest.tabs.splice(Math.min(index, dest.tabs.length), 0, t);
        dest.active = t.id;
        const ids = paneIds(t.root);
        dest.focused = ids.includes(t.lastFocus) ? t.lastFocus : ids[0];
        dest.zoomed = null;
        raise(dest);
        dropEmpty();
        render();
        return ok({ window: dest.id, tabs: dest.tabs.map(x => x.id) });
      }

      case 'resize': {
        const p = need(args.pane);
        const s = frac(args.size);
        if (!(s > 0 && s < 1)) throw kerr('bad_request', 'size must be a fraction between 0 and 1');
        const f = findPane(p.id);
        if (!f.parent) throw kerr('bad_request', `${label(p)} fills its tab, so there is nothing to resize against`);
        const old = f.parent.kids[f.index].size;
        f.parent.kids.forEach((k, i) => { if (i !== f.index) k.size = k.size * (1 - s) / (1 - old); });
        f.parent.kids[f.index].size = s;
        render();
        return ok({ layout: toTree(f.tab.root) });
      }

      case 'list':
        return ok({
          windows: S.windows.map(w => ({
            id: w.id, key: w.id === S.key,
            tabs: w.tabs.map(t => ({ id: t.id, title: tabTitle(t), active: t.id === w.active, layout: toTree(t.root) })),
          })),
          panes: Object.values(S.panes).map(summary),
        });

      case 'focus': {
        if (args.pane) focusPane(need(args.pane));
        else if (args.tab) {
          const t = needTab(args.tab), w = winOfTab(t), ids = paneIds(t.root);
          w.active = t.id;
          w.zoomed = null;
          w.focused = ids.includes(t.lastFocus) ? t.lastFocus : ids[0];
          raise(w);
        } else if (args.window) raise(targetWin(args.window));
        else throw kerr('bad_request', 'focus needs a pane, tab or window');
        render();
        return ok({ window: S.key });
      }

      case 'zoom': {
        const p = need(args.pane);
        const was = findPane(p.id).win.zoomed === p.id;
        focusPane(p);
        const w = findPane(p.id).win;
        w.zoomed = was ? null : p.id;
        render();
        return ok({ zoomed: !!w.zoomed });
      }

      case 'close': {
        let victims;
        if (args.pane) victims = [need(args.pane)];
        else if (args.tab) victims = paneIds(needTab(args.tab).root).map(i => S.panes[i]);
        else if (args.window) { const w = targetWin(args.window); victims = w.tabs.flatMap(t => paneIds(t.root)).map(i => S.panes[i]); }
        else throw kerr('bad_request', 'close needs a pane, tab or window');
        victims.forEach(p => { detach(p.id); kill(p); });
        dropEmpty();
        render();
        return ok({ closed: victims.map(p => p.id) });
      }

      case 'restart': {
        const p = need(args.pane);
        start(p);
        await settled(p);
        if (p.state === 'failed') throw kerr('start_failed', p.error);
        return ok({ pane: summary(p) });
      }

      case 'send': {
        const p = need(args.pane);
        if (p.type !== 'term') throw kerr('wrong_type', `${label(p)} is a ${p.type} pane; send only works on term panes`);
        if (p.state !== 'running') throw kerr('bad_request', `${label(p)} is ${p.state}`);
        if (p.busy) { termPrint(p, args.text ?? ''); render(); } else runTerm(p, args.text ?? '');
        return ok({});
      }

      case 'navigate': {
        const p = need(args.pane);
        if (p.type !== 'web') throw kerr('wrong_type', `${label(p)} is a ${p.type} pane; navigate only works on web panes`);
        if (!args.url) throw kerr('bad_request', 'missing url');
        p.url = normUrl(args.url);
        p.urlDraft = null;
        start(p);
        await settled(p);
        return ok({ pane: summary(p) });
      }

      default:
        throw kerr('bad_request', `unknown command "${cmd}"`);
    }
  } catch (e) {
    if (e instanceof KErr) { dropEmpty(); render(); return { id, ok: false, error: { code: e.code, message: e.message } }; }
    throw e;
  }
}

// ---------------------------------------------------------------------------
// kanna side: command line -> protocol request (see docs/kanna-spec.md)
// ---------------------------------------------------------------------------
const usage = msg => Object.assign(new Error(msg), { usage: true });

function tokenize(line) {
  const out = [], re = /"((?:[^"\\]|\\.)*)"|'([^']*)'|(\S+)/g;
  let m;
  while ((m = re.exec(line))) out.push(m[1] ?? m[2] ?? m[3]);
  return out;
}

function parseLayout(src) {
  const toks = [];
  for (let i = 0; i < src.length;) {
    const c = src[i], rest = src.slice(i);
    let m;
    if (/\s/.test(c)) { i++; continue; }
    if ('|/()'.includes(c)) { toks.push({ t: c }); i++; continue; }
    if (c === ':') {
      if (!(m = /^:(\d*\.?\d+(?:\/\d*\.?\d+)?%?)/.exec(rest))) throw usage(`expected a size like 1/3 after ":" (position ${i + 1})`);
      toks.push({ t: 'size', v: m[1] }); i += m[0].length; continue;
    }
    if (!(m = /^[A-Za-z0-9_.-]+/.exec(rest))) throw usage(`unexpected "${c}" at position ${i + 1}`);
    toks.push({ t: 'name', v: m[0] }); i += m[0].length;
  }
  let p = 0;
  const peek = () => toks[p];
  const row = () => { const k = [col()]; while (peek()?.t === '|') { p++; k.push(col()); } return k.length === 1 ? k[0] : { split: 'row', children: k }; };
  const col = () => { const k = [atom()]; while (peek()?.t === '/') { p++; k.push(atom()); } return k.length === 1 ? k[0] : { split: 'column', children: k }; };
  const atom = () => {
    const tk = peek();
    let n;
    if (!tk) throw usage('layout ended too early');
    if (tk.t === '(') { p++; n = row(); if (peek()?.t !== ')') throw usage('missing ")"'); p++; }
    else if (tk.t === 'name') { p++; n = { pane: tk.v }; }
    else throw usage(`unexpected "${tk.t === 'size' ? ':' + tk.v : tk.t}"`);
    if (peek()?.t === 'size') n = { ...n, size: toks[p++].v };
    return n;
  };
  const tree = row();
  if (p < toks.length) throw usage(`unexpected "${toks[p].v ?? toks[p].t}"`);
  if (tree.pane != null) return { split: 'row', children: [{ pane: tree.pane }] };
  delete tree.size;
  return tree;
}

function toRequest(line) {
  line = line.trim();
  if (line.startsWith('{')) { try { return JSON.parse(line); } catch (e) { throw usage('invalid JSON: ' + e.message); } }
  const tk = tokenize(line);
  if (tk[0] === 'kanna') tk.shift();
  const [cmd, ...rest] = tk;
  const flags = {}, pos = [];
  for (let i = 0; i < rest.length; i++) {
    const a = rest[i];
    if (!a.startsWith('--')) { pos.push(a); continue; }
    const k = a.slice(2);
    const hasValue = rest[i + 1] != null && !rest[i + 1].startsWith('--');
    if (k === 'tab') flags.tab = ['focus', 'close'].includes(cmd) && hasValue ? rest[++i] : true;
    else if (['no-wait', 'json'].includes(k)) flags[k] = true;
    else if (k === 'split') flags.split = ['right', 'down', 'auto'].includes(rest[i + 1]) ? rest[++i] : 'auto';
    else if (['name', 'cmd', 'cwd', 'app', 'device', 'size', 'mux', 'to', 'side', 'to-tab', 'to-window', 'window', 'index'].includes(k)) {
      if (!hasValue) throw usage(`--${k} needs a value`);
      flags[k] = rest[++i];
    } else throw usage(`unknown flag --${k}`);
  }
  if (flags.mux && flags.mux !== 'kmux') throw usage(`this mockup only models kmux (got --mux ${flags.mux})`);
  const needPos = (n, what) => { if (pos.length < n) throw usage(`${cmd} needs ${what}`); };
  const target = () => {
    if (pos[0]) return { pane: pos[0] };
    if (typeof flags.tab === 'string') return { tab: flags.tab };
    if (flags.window) return { window: flags.window };
    throw usage(`${cmd} needs a pane, --tab TAB or --window WIN`);
  };
  switch (cmd) {
    case 'open': {
      needPos(1, 'a pane type: term, web or ios');
      const args = { type: pos[0] };
      if (pos[0] === 'web') { needPos(2, 'a URL'); args.url = pos[1]; }
      for (const k of ['name', 'cmd', 'cwd', 'app', 'device', 'size', 'window']) if (flags[k] != null) args[k] = flags[k];
      args.split = flags.split || 'auto';
      if (flags.tab) { args.tab = true; delete args.split; }
      if (flags['no-wait']) args.wait = false;
      return { cmd: 'open', args };
    }
    case 'arrange': {
      needPos(1, 'a layout, e.g. \'a | (b / c)\'');
      const args = { layout: parseLayout(pos.join(' ')) };
      if (flags.window) args.window = flags.window;
      return { cmd, args };
    }
    case 'move':
      needPos(1, 'a pane');
      if (flags['to-tab']) return { cmd, args: { pane: pos[0], tab: flags['to-tab'], ...(flags.window ? { window: flags.window } : {}) } };
      if (flags['to-window']) return { cmd, args: { pane: pos[0], window: flags['to-window'] } };
      if (!flags.to) throw usage('move needs --to PANE [--side …], --to-tab TAB|new or --to-window WIN|new');
      return { cmd, args: { pane: pos[0], to: flags.to, side: flags.side || 'swap' } };
    case 'move-tab': {
      needPos(1, 'a tab');
      const args = { tab: pos[0] };
      if (flags['to-window']) args.window = flags['to-window'];
      if (flags.index != null) args.index = Number(flags.index);
      return { cmd, args };
    }
    case 'resize': needPos(2, 'a pane and a size'); return { cmd, args: { pane: pos[0], size: pos[1] } };
    case 'list': case 'capabilities': return { cmd, args: {} };
    case 'mux': return { cmd: 'capabilities', args: {} };
    case 'focus': case 'close': return { cmd, args: target() };
    case 'restart': case 'zoom': needPos(1, 'a pane'); return { cmd, args: { pane: pos[0] } };
    case 'send': needPos(2, 'a pane and text'); return { cmd, args: { pane: pos[0], text: pos.slice(1).join(' ') } };
    case 'navigate': needPos(2, 'a pane and a URL'); return { cmd, args: { pane: pos[0], url: pos[1] } };
    case undefined: throw usage('empty command');
    default: throw usage(`unknown command "${cmd}" (type help)`);
  }
}

const EXIT = { bad_request: 2, layout_invalid: 2, not_found: 4, name_taken: 1, wrong_type: 1, start_failed: 1 };
const HELP = `commands (the "kanna" prefix is optional; raw JSON requests work too):
  open term [--cmd CMD] [--cwd DIR]        open web URL        open ios --app APP [--device NAME]
      shared: --name N  --split [right|down]  --size 1/3  --tab  --window WIN|new  --no-wait
  arrange 'a:2/3 | (b / c:1/3)' [--window WIN]     "|" side by side, "/" stacked, ( ) group, :size
  move PANE --to OTHER [--side left|right|top|bottom|swap]
  move PANE --to-tab TAB|new [--window WIN]        move PANE --to-window WIN|new
  move-tab TAB [--to-window WIN|new] [--index N]
  focus PANE | --tab TAB | --window WIN            close PANE | --tab TAB | --window WIN
  resize PANE 1/3    zoom PANE    restart PANE    send PANE TEXT    navigate PANE URL    list    mux`;

// ---------------------------------------------------------------------------
// Console
// ---------------------------------------------------------------------------
function log(kind, text) {
  const el = $('#log');
  el.append(h('div', { class: 'l-' + kind }, text));
  el.scrollTop = el.scrollHeight;
}
async function send(req, source) {
  req = { id: String(++S.n.req), ...req };
  log('req', `${source === 'ui' ? '(ui) ' : ''}→ ${JSON.stringify(req)}`);
  const res = await handle(req);
  log(res.ok ? 'res' : 'err', `← ${JSON.stringify(res)}`);
  if (source !== 'ui') log('exit', `exit ${res.ok ? 0 : EXIT[res.error.code] ?? 1}`);
  return res;
}
const ui = req => send(req, 'ui');

async function runLine(line) {
  if (!line.trim()) return;
  log('in', `$ kanna ${line.replace(/^kanna\s+/, '')}`);
  if (line.trim() === 'help') { log('info', HELP); return; }
  let req;
  try { req = toRequest(line); }
  catch (e) { log('err', `kanna: ${e.message}`); log('exit', 'exit 2'); return; }
  await send(req, 'kanna');
}

const history = [];
let hIdx = 0;
$('#cmdform').addEventListener('submit', e => {
  e.preventDefault();

function render() {
  for (const w of S.windows) {
    const t = activeTabOf(w);
    if (t && locate(t.root, w.focused)) t.lastFocus = w.focused;
  }
  const desk = $('#desktop');
  const a = document.activeElement;
  const keep = a && a.dataset && a.dataset.keep;
  desk.innerHTML = '';
  if (!S.windows.length) {
    desk.append(h('div', { class: 'desktop-empty' }, 'No windows.', h('div', {},
      ['term', 'web', 'ios'].map(type => h('button', { onclick: () => ui({ cmd: 'open', args: { ...defaultsFor(type), window: 'new' } }) }, `new ${type} window`)))));
    return;
  }
  for (const w of S.windows) desk.append(renderWindow(w));
  desk.querySelectorAll('.term-body').forEach(b => { b.scrollTop = b.scrollHeight; });
  const want = S.urlEdit ? 'url:' + S.urlEdit : keep;

function activateWin(w) {

function renderNode(node, w, share = 1) {
  if (node.t === 'pane') return renderPane(S.panes[node.id], w);
  const el = h('div', { class: `split ${node.dir}` });
  node.kids.forEach((k, i) => {
    if (i > 0) el.append(divider(node, i - 1));
    const c = renderNode(k.node, w, k.size);
    c.style.flex = `${k.size} ${k.size} 0px`;
    el.append(c);
  });
  return el;

function divider(split, i) {
  const d = h('div', { class: 'divider' });
  d.addEventListener('pointerdown', e => {
    e.preventDefault();
    d.setPointerCapture(e.pointerId);
    d.classList.add('dragging');
    const a = d.previousElementSibling, b = d.nextElementSibling;
    const row = split.dir === 'row';
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const start = row ? ra.left : ra.top, span = (row ? rb.right : rb.bottom) - start;
    const pair = split.kids[i].size + split.kids[i + 1].size;
    const min = Math.min(MIN_PX, span / 2);
    const tip = h('div', { class: 'drag-tip' });
    document.body.append(tip);
    const move = ev => {
      const pos = clamp((row ? ev.clientX : ev.clientY) - start, min, span - min);
      let s = pair * pos / span;
      const snap = NICE.find(f => Math.abs(s - f) < 0.015 && f < pair);
      if (snap) s = snap;
      split.kids[i].size = s;
      split.kids[i + 1].size = pair - s;
      [[a, s], [b, pair - s]].forEach(([el, v]) => { el.style.flex = `${v} ${v} 0px`; });
      tip.textContent = `${fmtFrac(s)} ${row ? '|' : '/'} ${fmtFrac(pair - s)}`;
      tip.style.left = `${ev.clientX + 12}px`;
      tip.style.top = `${ev.clientY + 12}px`;
    };
    const up = () => {
      tip.remove();
      d.removeEventListener('pointermove', move);
      d.removeEventListener('pointerup', up);
      render();
    };
    d.addEventListener('pointermove', move);
    d.addEventListener('pointerup', up);
  });
  return d;
}

function defaultsFor(type) {

}

function focusInput(id) {

  if (el) el.focus(); else document.activeElement?.blur();
}
function switchTab(w, t) {
  const ids = paneIds(t.root);
  w.active = t.id;
  w.zoomed = null;
  w.focused = ids.includes(t.lastFocus) ? t.lastFocus : ids[0] ?? null;
  raise(w);
  render();
  focusInput(w.focused);
}
function cycleTab(d) {
  const w = keyWin();
  if (!w || w.tabs.length < 2) return;
  const i = w.tabs.findIndex(t => t.id === w.active), n = w.tabs.length;
  switchTab(w, w.tabs[(i + d + n) % n]);
}
async function cyclePane(d) {
  const w = keyWin();
  const ids = paneIds(activeTabOf(w)?.root), n = ids.length;
  if (n < 2) return;
  const next = ids[(ids.indexOf(w.focused) + d + n) % n];
  await ui({ cmd: 'focus', args: { pane: next } });
  focusInput(next);

async function cycleWin(d) {
  const n = S.windows.length;
  if (n < 2) return;
  const i = S.windows.findIndex(w => w.id === S.key);
  const next = S.windows[(i + d + n) % n];
  await ui({ cmd: 'focus', args: { window: next.id } });
  focusInput(next.focused);

// ---------------------------------------------------------------------------
// Dragging: windows, tabs, panes
// ---------------------------------------------------------------------------
let suppressClick = false;
function track(move, up) {
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', ev => { window.removeEventListener('pointermove', move); up(ev); }, { once: true });
}
function desktopPoint(ev) {
  const r = $('#desktop').getBoundingClientRect();
  if (ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) return null;
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
function showNewWindowHint(hint, ev, w) {
  Object.assign(hint.style, { left: `${ev.clientX - 30}px`, top: `${ev.clientY - 14}px`, width: `${w}px`, height: `${Math.round(w * 0.62)}px` });
  hint.textContent = 'new window';
  hint.className = 'drop-hint new-win';
  hint.hidden = false;
}
function placeNewWindow(id, pt, srcW) {
  const w = winById(id);
  if (!w || !pt) return;
  const { W, H } = desktopSize();
  w.w = Math.min(srcW, W - 20);
  w.h = Math.min(Math.round(srcW * 0.62), H - 20);
  w.x = clamp(pt.x - 30, 0, W - w.w);
  w.y = clamp(pt.y - 14, 0, H - w.h);
  render();
}

function startWinDrag(e, w, el) {
  if (e.button !== 0 || e.target.closest('button')) return;
  e.preventDefault();
  const x0 = e.clientX, y0 = e.clientY, wx = w.x, wy = w.y;
  const { W, H } = desktopSize();
  track(ev => {
    w.x = clamp(wx + ev.clientX - x0, 80 - w.w, W - 80);
    w.y = clamp(wy + ev.clientY - y0, 0, H - 28);
    el.style.left = `${w.x}px`;
    el.style.top = `${w.y}px`;
  }, () => {});
}
function startWinResize(e, w, el) {
  if (e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();
  activateWin(w);
  const x0 = e.clientX, y0 = e.clientY, w0 = w.w, h0 = w.h;
  track(ev => {
    w.w = Math.max(320, w0 + ev.clientX - x0);
    w.h = Math.max(220, h0 + ev.clientY - y0);
    el.style.width = `${w.w}px`;
    el.style.height = `${w.h}px`;
  }, () => {});
}

// Tabs: drag within or between tab bars to reorder or move; onto the desktop for a new window.
function startTabDrag(e, t, btn) {
  if (e.button !== 0 || e.target.classList.contains('x')) return;
  const x0 = e.clientX, y0 = e.clientY;
  let dragging = false, drop = null;
  const srcW = winOfTab(t).w;
  const hint = h('div', { class: 'drop-hint', hidden: true });
  document.body.append(hint);
  const clear = () => document.querySelectorAll('.drop-before, .drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  track(ev => {
    if (!dragging && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 5) return;
    dragging = true;
    btn.classList.add('dragging');
    clear();
    hint.hidden = true;
    drop = null;
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    const bar = under?.closest('.win-tabs');
    if (bar) {
      const els = [...bar.querySelectorAll('.tab')];
      let i = els.findIndex(x => { const r = x.getBoundingClientRect(); return ev.clientX < r.left + r.width / 2; });
      if (i < 0) i = els.length;
      if (i < els.length) els[i].classList.add('drop-before'); else els[els.length - 1]?.classList.add('drop-after');
      drop = { window: bar.dataset.win, index: i };
    } else if (under === $('#desktop')) {
      showNewWindowHint(hint, ev, srcW * 0.6);
      drop = { window: 'new', pt: desktopPoint(ev) };
    }
  }, async () => {
    hint.remove();
    clear();
    btn.classList.remove('dragging');
    if (!dragging) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; });
    if (!drop) return;
    const res = await ui({ cmd: 'move-tab', args: { tab: t.id, window: drop.window, ...(drop.index != null ? { index: drop.index } : {}) } });
    if (res.ok && drop.window === 'new') placeNewWindow(res.window, drop.pt, srcW * 0.6);
  });
}

// Panes: ⌘-drag (or ⌥-drag) onto another pane's edge to dock, its centre to swap,
// a tab to move there, + for a new tab in that window, or the desktop for a new window.
function startPaneDrag(e, p, el) {
  if (e.button !== 0 || !(e.metaKey || e.altKey)) return;
  e.preventDefault();
  const srcW = findPane(p.id).win.w;
  const ghost = h('div', { class: 'drag-tip' }, `move ${p.name || p.id}`);
  const hint = h('div', { class: 'drop-hint', hidden: true });
  document.body.append(ghost, hint);
  el.classList.add('dragging');
  let drop = null;
  const clear = () => document.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
  track(ev => {
    ghost.style.left = `${ev.clientX + 12}px`;
    ghost.style.top = `${ev.clientY + 12}px`;
    clear();
    hint.hidden = true;
    hint.className = 'drop-hint';
    drop = null;
    const under = document.elementFromPoint(ev.clientX, ev.clientY);
    const tabEl = under?.closest('.tab, .tab-add');
    if (tabEl) {
      if (tabEl.dataset.tab) {
        if (findPane(p.id).tab.id !== tabEl.dataset.tab) { tabEl.classList.add('drop-target'); drop = { tab: tabEl.dataset.tab }; }
      } else { tabEl.classList.add('drop-target'); drop = { tab: 'new', window: tabEl.dataset.win }; }
      return;
    }
    if (under === $('#desktop')) {
      showNewWindowHint(hint, ev, srcW * 0.6);
      drop = { window: 'new', pt: desktopPoint(ev) };
      return;
    }
    const target = under?.closest('.pane');
    if (!target || target.dataset.id === p.id) return;
    const r = target.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width, fy = (ev.clientY - r.top) / r.height;
    let side = 'swap';
    if (!(fx > .3 && fx < .7 && fy > .3 && fy < .7)) {
      const dist = { left: fx, right: 1 - fx, top: fy, bottom: 1 - fy };
      side = Object.keys(dist).reduce((a, b) => dist[a] <= dist[b] ? a : b);
    }
    drop = { to: target.dataset.id, side };
    const [x, y, w, hgt] = { left: [0, 0, .5, 1], right: [.5, 0, .5, 1], top: [0, 0, 1, .5], bottom: [0, .5, 1, .5], swap: [0, 0, 1, 1] }[side];
    Object.assign(hint.style, { left: `${r.left + x * r.width}px`, top: `${r.top + y * r.height}px`, width: `${w * r.width}px`, height: `${hgt * r.height}px` });
    hint.textContent = side === 'swap' ? 'swap' : '';
    hint.hidden = false;
  }, async () => {
    ghost.remove(); hint.remove(); clear();
    el.classList.remove('dragging');
    if (!drop) return;
    if (drop.to) ui({ cmd: 'move', args: { pane: p.id, to: drop.to, side: drop.side } });
    else if (drop.tab) ui({ cmd: 'move', args: { pane: p.id, tab: drop.tab, ...(drop.window ? { window: drop.window } : {}) } });
    else {
      const res = await ui({ cmd: 'move', args: { pane: p.id, window: 'new' } });
      if (res.ok) placeNewWindow(res.window, drop.pt, srcW * 0.6);
    }
  });
}

// ---------------------------------------------------------------------------
// Menus and hotkeys
// ---------------------------------------------------------------------------
let menuEl = null;
function showMenuAt(x, y, items) {
  hideMenu();
  menuEl = h('div', { class: 'menu' }, items.map(it => it === '-' ? h('hr') :
    h('button', { onclick: () => { hideMenu(); it[1](); } }, h('span', {}, it[0]), it[2] ? h('span', { class: 'key' }, it[2]) : null)));
  document.body.append(menuEl);
  menuEl.style.left = `${clamp(x, 8, innerWidth - menuEl.offsetWidth - 8)}px`;
  menuEl.style.top = `${clamp(y, 8, innerHeight - menuEl.offsetHeight - 8)}px`;
}
function showMenu(anchor, items) { const r = anchor.getBoundingClientRect(); showMenuAt(r.left, r.bottom + 2, items); }
function hideMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
document.addEventListener('mousedown', e => {
  if (menuEl && !menuEl.contains(e.target)) hideMenu();
  if (S.urlEdit && !e.target.closest('.url-edit')) { S.urlEdit = null; render(); }
});
$('#menu-pane').addEventListener('click', e => showMenu(e.currentTarget, paneMenu(focusedPane())));
$('#menu-view').addEventListener('click', e => showMenu(e.currentTarget, viewMenu()));
$('#menu-window').addEventListener('click', e => showMenu(e.currentTarget, windowMenu()));

// kmux binds these to ⌘. The browser never hands ⌘N, ⌘T, ⌘W or ⌘` to a page,
// so every shortcut also works with ⌥ in place of ⌘.
const BROWSER_OWNED = ['KeyN', 'KeyT', 'KeyW', 'Backquote'];
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey === e.altKey) return;
  if (e.metaKey && BROWSER_OWNED.includes(e.code)) return;
  const p = focusedPane();
  const actions = {
    KeyD: () => splitFrom(p, e.shiftKey ? 'down' : 'right', 'term'),
    KeyT: newTab,
    KeyN: newWindow,
    KeyW: () => e.shiftKey ? keyWin() && ui({ cmd: 'close', args: { window: S.key } }) : p && ui({ cmd: 'close', args: { pane: p.id } }),
    KeyR: () => p && ui({ cmd: 'restart', args: { pane: p.id } }),
    KeyL: () => editUrl(p),
    Enter: () => e.shiftKey && p && ui({ cmd: 'zoom', args: { pane: p.id } }),
    BracketLeft: () => e.shiftKey ? cycleTab(-1) : cyclePane(-1),
    BracketRight: () => e.shiftKey ? cycleTab(1) : cyclePane(1),
    Backquote: () => cycleWin(e.shiftKey ? -1 : 1),
  };
  if (actions[e.code]) { e.preventDefault(); hideMenu(); actions[e.code](); }
});

function toggleConsole() {
  const c = $('#console');
  c.classList.toggle('collapsed');
  $('#toggle-console').textContent = c.classList.contains('collapsed') ? 'Show' : 'Hide';
  render();
}
$('#toggle-console').addEventListener('click', toggleConsole);

// ---------------------------------------------------------------------------
// Boot, reset, demo
// ---------------------------------------------------------------------------
function reset(withShell = true) {
  S && Object.values(S.panes).forEach(kill);
  S = freshState();
  $('#log').innerHTML = '';
  if (withShell) {
    const w = makeWindow();
    const p = createPane('term', {});
    place(p.id, w, {});
    w.focused = p.id;
    start(p);
  }
  render();
  log('info', 'kmux mockup ready. Type help, or press "Run demo".');
  log('info', 'In kmux: menus in the menu bar, right-click a pane or tab. ⌘D / ⇧⌘D split · ⌘[ ⌘] panes · ⇧⌘[ ⇧⌘] tabs · ⌘` windows · ⌘T tab · ⌘N window · ⌘W close pane · ⇧⌘W close window · ⌘R restart · ⇧⌘↩ zoom · ⌘L open URL. ⌥ works in place of ⌘.');
  log('info', 'Drag a window by its title bar, resize from its corner. Drag tabs within or between windows, or onto the desktop. ⌘-drag a pane onto a pane edge, a pane centre (swap), a tab, + or the desktop.');
}

const DEMO = [
  'open term --name server --cmd "npm run dev"',
  'open web http://localhost:3000 --name site --split right --size 1/3',
  'open ios --name phone --app ./build/MyApp.app --split down --size 1/3',
  "arrange 'site:1/4 | server:1/2 | phone'",
  'open term --name logs --window new',
  'move phone --to-window w2',
  'list',
];
let demoRunning = false;
$('#demo').addEventListener('click', async () => {
  if (demoRunning) return;
  demoRunning = true;
  reset(false);
  for (const line of DEMO) {
    await new Promise(r => setTimeout(r, 900));
    await runLine(line);
  }
  demoRunning = false;
});
$('#reset').addEventListener('click', () => { if (!demoRunning) reset(); });

reset();
</script>
